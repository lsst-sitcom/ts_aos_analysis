title: "Nightly Report: IQ, AOS, Thermal, Aberrations and Degrees of Freedom"
description: Generate a nightly report for the IQ, AOS, Thermal, Aberrations and Degrees of Freedom.
authors:
  - name: Guillem Megias
    slack: gmegias
tags:
  - lsstcam
  - nightly_report
parameters:
  day:
    type: integer
    description: Day for the report.
    default: 20250530
  seq_min:
    type: integer
    description: Minimum sequence number to include in the report.
    default: 100
  seq_max:
    type: integer
    description: Maximum sequence number to include in the report.
    default: 200
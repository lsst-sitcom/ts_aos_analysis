title: "Nightly Report: IQ, AOS, Thermal, Aberrations and Degrees of Freedom"
description: Generate a nightly report for the IQ, AOS, Thermal, Aberrations and Degrees of Freedom.
authors:
  - name: Guillem Megias
    slack: gmegias
  - name: Craig Lage
    slack: craiglagegit
tags:
  - lsstcam
  - nightly_report
parameters:
  day_obs:
    type: string
    format: dayobs
    description: Day for the report.
    dynamic_default: "yesterday"
  seq_min:
    type: integer
    description: Minimum sequence number to include in the report.
    default: 0
  seq_max:
    type: integer
    description: Maximum sequence number to include in the report.
    default: 900
  make_detail_plot:
    type: boolean
    description: Make detail plot or not
    default: False
  detailed_seq_min:
    type: integer
    description: Minimum sequence number to include in the detailed report.
    default: 100
  detailed_seq_max:
    type: integer
    description: Maximum sequence number to include in the detailed report.
    default: 200

schedule:
  - freq: "daily"
    hour: 12
title: "Observing Blocks: plot parameter space explored for a given science program."
description: Generate an observing blocks parameter space plot
authors:
  - name: Chris Suberlak
    slack: suberlak
tags:
  - lsstcam
  - observing_blocks
  - observing
parameters:
  day_obs_min:
    type: string
    format: dayobs
    description: Minimum day to use for consDB query.
    dynamic_default: "-2m"  # Two months ago
  day_obs_max:
    type: string
    format: dayobs
    description: Maximum day to use for consDB query.
    dynamic_default: "today"  # Two months ago
  program_constraint:
    type: string
    description: Science program constraint to use for corner plot.
    default: 'BLOCK-T614'
  observation_constraint:
    type: string
    description: Observation reason constraint to use for corner plot.
    default: None
  target_constraint:
    type: string
    description: Target name constraint to use for corner plot.
    default: None
schedule:
  - freq: "daily"
    hour: 12 # rerun at 12pm